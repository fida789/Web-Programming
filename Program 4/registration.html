<html>
<head>
<title>Registration form</title>
<style>
body{
background-color:lightblue;
width:700 px;
margin:auto;
}
td{
padding:10px;
}
</style>
</head>
<body>
<h2 align="center">Registration form</h2>
<form>
<table>
<tr>
<td>Full name</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Mobile number</td>
<td><input type="text"></td>
</tr>
<tr>
<td>Email id</td>
<td><input type="email"></td>
</tr>
<tr>
<td>Age</td>
<td><input type="number"></td>
</tr>
<tr>
<td>Gender</td>
<td><input type="radio" name="gender">Male
<input type="radio" name="gender">Female
<input type="radio" name="gender">Others
</td>
<tr>
<td>Date of birth</td>
<td><input type="date"></td>
</tr>
<tr>
<td>Address</td>
<td><textarea rows="7" cols="30"></textarea>
</td>
</tr>
<tr>
<td>Current study</td>
<td><select>
<option>B.tech</option>
<option>MCA</option>
<option>BSC</option>
<option>M.Tech</option>
</select></td>
</tr>
<tr>
<td>Department</td>
<td><select>
<option>CS</option>
<option>ES</option>
<option>EEE</option>
<option>ME</option>
</select>
</td></tr>
<tr>
<td>upload cv</td>
<td><input type="file"></td></tr>
<tr><td>Programming language</td>
<td><input type="checkbox">HTML
<input type="checkbox">React JS
<input type="checkbox">CSS
<input type="checkbox">flutter</td></tr>
<tr>
<td>Language</td>
<td><input type="checkbox">English
<input type="checkbox">Malayalam
<input type="checkbox">Arabic
<input type="checkbox">Hindi
</td></tr>
<tr>
<td><input type="submit" value="submit">
</td>
<td><input type="reset" value="reset">
</td>
</tr>
</table>
</form>
</body>
</html>
